[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-crypto-project"
version = "0.1.0"
requires-python = ">=3.11"
description = "Ethereum activity research and auditable Task B scam pipelines"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "pyarrow>=18,<24",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
serving = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<0.29",
]

[project.scripts]
chainrisk-task-b = "research.task_b.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["chainrisk*", "research", "research.task_b*"]
exclude = ["apps*", "deploy*", "scripts*", "checks*"]

[tool.setuptools.package-data]
"research.task_b" = ["configs/*.json", "source_catalog.json"]
