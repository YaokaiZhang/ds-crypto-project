# Offline repository regression plus independent Docker model API reproduction.
name: model-api

on:
  push:
    paths: ["deploy/**", "packages/**", "checks/**", "apps/backend/**", "apps/frontend/**", "research/**", "pyproject.toml", "uv.lock", ".github/workflows/model-api.yml"]
  pull_request:
    paths: ["deploy/**", "packages/**", "checks/**", "apps/backend/**", "apps/frontend/**", "research/**", "pyproject.toml", "uv.lock", ".github/workflows/model-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-file-io:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify native cache publication and feed ownership
        run: python -m unittest checks.test_io -v

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install CPU Python and frontend test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install '.[serving]' -r deploy/inference_service/requirements.txt 'modal==1.6.2'
          npm --prefix apps/frontend ci
      - name: Run unified offline regression
        run: python checks/run.py
      - name: Type-check and build frontend
        run: npm --prefix apps/frontend run build

  reproduce:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and verify (deploy/reproduce.sh)
        run: deploy/reproduce.sh container
      - name: Server log on failure
        if: failure()
        run: docker logs chainrisk-model-api || true
